[package]
name = "rust-core"
version = "0.1.0"
edition = "2024"

# Built as a Node native addon, loaded by the Electron main process.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cpal = "0.18.2"
# `tiff` is here because a skin ships one under a `.png` name, not because skins are
# expected to use it: without the decoder that file cannot be re-encoded into something
# the browser will accept. See `copy_texture`.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
napi = { version = "3.12.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.3"
once_cell = "1.21.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
# Containers and codecs are separate features: "ogg" and "wav" only provide the readers,
# so without "vorbis" and "pcm" every .ogg and .wav in a sample bank fails to decode.
symphonia = { version = "0.6.1", features = [
    "mp3",
    "ogg",
    "vorbis",
    "wav",
    "pcm",
    "adpcm",
    "flac",
] }

[build-dependencies]
napi-build = "2.4.1"
